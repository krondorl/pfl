name: Release

on:
  push:
    tags:
      - "v*" # Triggers when pushing a tag such as v0.1.0

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86-64, statically linked with MUSL
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            suffix: linux-x64
            extension: ""
            use_cross: true

          # Linux ARM64, statically linked with MUSL
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            suffix: linux-arm64
            extension: ""
            use_cross: true

          # macOS Intel
          - os: macos-15
            target: x86_64-apple-darwin
            suffix: macos-x64
            extension: ""
            use_cross: false

          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-arm64
            extension: ""
            use_cross: false

          # Windows x86-64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
            extension: ".exe"
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build Linux binary with cross
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build native binary with Cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          EXTENSION="${{ matrix.extension }}"

          BIN_PATH="target/${{ matrix.target }}/release/${REPO_NAME}${EXTENSION}"
          FINAL_BIN="${REPO_NAME}-${{ matrix.suffix }}-${TAG_NAME}${EXTENSION}"

          if [ ! -f "$BIN_PATH" ]; then
            echo "Binary not found: $BIN_PATH"
            exit 1
          fi

          mv "$BIN_PATH" "$FINAL_BIN"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$FINAL_BIN" > "${FINAL_BIN}.sha256"
          else
            shasum -a 256 "$FINAL_BIN" > "${FINAL_BIN}.sha256"
          fi

          echo "ASSET_BIN=$FINAL_BIN" >> "$GITHUB_ENV"
          echo "ASSET_SHA=${FINAL_BIN}.sha256" >> "$GITHUB_ENV"

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_BIN }}
            ${{ env.ASSET_SHA }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
